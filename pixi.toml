[workspace]
name = "trout"
description = "Phlex-based reconstruction framework for the SHiP experiment"
channels = [ "https://prefix.dev/ship-experiment/stable", "conda-forge"]
platforms = ["linux-64"]
# Enables source dependencies for the (opt-in) multi-package dev workflow
# below; inert for the other environments.
preview = ["pixi-build"]
requires-pixi = ">=0.68"

[feature.index.dependencies]
rattler-build = ">=0.35"

[dependencies]
# SHiP/HEP packages (prefix.dev/ship-experiment/stable + conda-forge). NB: shipdatamodel is
# declared in [feature.released] below, not here, so the dev environment can
# swap it for a sibling source build without this channel spec in scope.
shipgeometry = "*"
# geant4WorldLogical() returns a reference from 0.6, which also drops the
# pre-0.5 spellings.
shipgeometryservice = ">=0.6"
# The SHiP namespace and the SHiP::FieldService* targets first ship in 0.4.0.
field-service-core = ">=0.4.0"
# Field-map file I/O (SHiP::FieldServiceMapIO), used by acts_field_provider.
field-service-mapio = ">=0.4.0"
# SHiP::FieldServiceActsAdapter, used by acts_field_provider.
field-service-acts = ">=0.4.0"
# generate_constant_fieldmap, used by the smoke test.
field-service-tools = ">=0.4.0"
acts-core = "*"
phlex = ">=0.4.1"
root = ">=6.36"
geant4 = ">=11.3"
random123 = "*"
# SHiP::random::PhiloxRng, for make_test_input.
# ship-random accepts only the requested minor in find_package (SameMinorVersion),
# so keep this in step with find_package(SHiPRandom 0.4) in CMakeLists.txt.
ship-random = ">=0.4,<0.5"
libjsonnet = "*"

# C++ libraries
libboost-devel = "*"
tbb-devel = "*"
spdlog = "*"
fmt = "*"
mp-units = "*"
ms-gsl = "*"
eigen = "*"

# Build tools
cmake = ">=3.27"
ninja = "*"
# >=2 brings GCC 15, which phlex 0.4.1's headers need (std::from_range).
cxx-compiler = ">=2"

# shipdatamodel as its released conda build (prefix.dev/ship-experiment/stable). Held in a
# feature that every environment pulls in, deliberately NOT in the base
# [dependencies]: those are shared by all environments, so a channel spec there
# stays in scope for dev even when [feature.dev] declares a path dependency,
# and the solver can pick the channel binary over the sibling checkout
# (ShipSoft/aegir#90).
[feature.released.dependencies]
# 0.6 renamed the fields to snake_case and moved the units into SHiP.
shipdatamodel = ">=0.6"

[activation]
scripts = ["activate.sh"]

[tasks]

configure = { cmd = """
cmake -S . -B build -G Ninja \
    -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_PREFIX_PATH=$CONDA_PREFIX
""" }

build = { cmd = "cmake --build build --parallel", depends-on = ["configure"] }
install = { cmd = "cmake --install build", depends-on = ["build"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
smoke = { cmd = "scripts/smoke.sh", depends-on = ["build"] }
clean = "rm -rf build"

[feature.bench.dependencies]
hyperfine = "*"
linux-perf = "*"

# Linting / formatting toolchain. prek orchestrates the hooks; the tools come
# from this environment so versions are tracked in pixi.lock and run
# identically everywhere.
[feature.lint.dependencies]
prek = "*"
python = ">=3.11"
clang-format = "23.*"
codespell = "*"
reuse = "*"
cffconvert = "*"
commitizen = "*"

# Pinned via PyPI to match the hook revs exactly: conda-forge's cpplint is
# stuck at 1.6.0 (a different, stale fork), and its gersemi lags upstream and
# would reflow CMake files.
[feature.lint.pypi-dependencies]
cpplint = "==2.0.2"
gersemi = "==0.29.2"

[feature.lint.tasks]
lint = "prek run --all-files"
# Install the git hooks and route them through `pixi run` so the
# conda-provided hook tools are on PATH at commit time (required on NixOS,
# where the tools are not runnable without pixi activation).
install-hooks = '''
prek install --hook-type pre-commit --hook-type commit-msg
hooks=$(git rev-parse --git-path hooks)
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/pre-commit"
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/commit-msg"
'''

# --- Multi-package development ------------------------------------------
# The dev environment adds a debugger to the default one. It can also build
# shipdatamodel from a sibling checkout instead of the released conda
# package: uncomment the dependency below (../data-model has to exist and to
# package itself as a pixi-build source dependency), drop "released" from the
# dev environment's features in [environments], run `pixi lock`, then
# `pixi run -e dev build`/`install`/`test`/`phlex ...`. If "released" stays,
# the released shipdatamodel is still in scope and can win the solve.
#
# Leave it commented out in whatever you commit. A lock file that records the
# source dependency cannot be resolved without the sibling checkout, which
# breaks `pixi install --locked` for every environment, not just dev.
[feature.dev.dependencies]
# shipdatamodel = { path = "../data-model" }
gdb = "*"

[environments]
default = { features = ["released"], solve-group = "default" }
bench = { features = ["bench", "released"], solve-group = "default" }
index = { features = ["index", "released"], solve-group = "default" }
lint = { features = ["lint", "released"], solve-group = "lint" }
# Drop "released" here when building shipdatamodel from source, see above.
dev = { features = ["dev", "released"] }
